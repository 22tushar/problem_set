<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Study App</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Inline Manifest to make it a Single File PWA -->
    <script type="application/json" id="my-manifest">
    {
      "name": "Self Study App",
      "short_name": "SelfStudy",
      "start_url": "./index.html",
      "display": "standalone",
      "background_color": "#f3f4f6",
      "theme_color": "#4f46e5",
      "icons": [
        {
          "src": "https://via.placeholder.com/192x192/4f46e5/ffffff?text=SSA",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://via.placeholder.com/512x512/4f46e5/ffffff?text=SSA",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    }
    </script>
    <script>
        // Dynamically create the manifest link from the blob script above
        const manifestEl = document.getElementById('my-manifest');
        const manifestBlob = new Blob([manifestEl.innerText], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkTag = document.createElement('link');
        linkTag.rel = 'manifest';
        linkTag.href = manifestURL;
        document.head.appendChild(linkTag);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .selection-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            outline: none;
        }

        select:focus {
            border-color: #4f46e5;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .primary-btn {
            background-color: #4f46e5;
            color: white;
        }

        .primary-btn:hover {
            background-color: #4338ca;
        }

        .question-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .question-card.hidden {
            display: none;
        }

        .badge {
            align-self: flex-start;
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
        }

        #q-title {
            font-size: 1.2rem;
            color: #111827;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .secondary-btn {
            display: block;
            text-align: center;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .secondary-btn:hover {
            background-color: #059669;
        }

        .gfg-btn {
            background-color: #f59e0b;
        }

        .gfg-btn:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Self Study App</h1>
            <p>Select a topic and master your DSA interview prep!</p>
        </header>

        <main>
            <div class="selection-card">
                <label for="topic-select">Choose Topic:</label>
                <select id="topic-select">
                    <option value="all">All Topics</option>
                    <option value="Array">Array</option>
                    <option value="String">String</option>
                    <option value="Tree">Tree</option>
                    <option value="Graph">Graph</option>
                    <option value="Trie">Trie</option>
                    <option value="DP">Dynamic Programming (DP)</option>
                </select>
                <button id="random-btn" class="primary-btn">Get Random Question</button>
            </div>

            <div id="question-card" class="question-card hidden">
                <span id="q-topic" class="badge">Topic</span>
                <h2 id="q-title">Question Title</h2>
                <div class="actions">
                    <a id="q-explanation-link" href="#" target="_blank" class="secondary-btn">📖 View Explanation / Striver Guide</a>
                    <a id="q-gfg-link" href="#" target="_blank" class="secondary-btn gfg-btn">💻 Practice on GFG (Companies & Figures)</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Expanded dataset with both Explanation (Striver/Conceptual) and GFG links
        const dsaQuestions = [
            // Array
            { 
                topic: "Array", 
                title: "Reverse the array", 
                explanationUrl: "https://takeuforward.org/data-structures/reverse-a-array/", 
                gfgUrl: "https://www.geeksforgeeks.org/write-a-program-to-reverse-an-array-or-string/" 
            },
            { 
                topic: "Array", 
                title: "Find the maximum and minimum element in an array", 
                explanationUrl: "https://takeuforward.org/data-structures/maximum-and-minimum-element-in-an-array/", 
                gfgUrl: "https://www.geeksforgeeks.org/maximum-and-minimum-in-an-array/" 
            },
            { 
                topic: "Array", 
                title: "Find the Kth max and min element of an array", 
                explanationUrl: "https://takeuforward.org/data-structures/kth-largest-smallest-element-in-an-array/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/kth-smallest-element/0" 
            },
            { 
                topic: "Array", 
                title: "Sort an array of 0s, 1s and 2s (Dutch National Flag Algorithm)", 
                explanationUrl: "https://takeuforward.org/data-structures/sort-an-array-of-0s-1s-and-2s/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/sort-an-array-of-0s-1s-and-2s4231/1" 
            },
            { 
                topic: "Array", 
                title: "Move all negative elements to end of array", 
                explanationUrl: "https://takeuforward.org/arrays/move-all-negative-elements-to-end-of-array/", 
                gfgUrl: "https://www.geeksforgeeks.org/move-negative-numbers-beginning-positive-end-constant-extra-space/" 
            },

            // String
            { 
                topic: "String", 
                title: "Reverse a String", 
                explanationUrl: "https://takeuforward.org/data-structures/reverse-a-string/", 
                gfgUrl: "https://www.geeksforgeeks.org/write-a-program-to-reverse-an-array-or-string/" 
            },
            { 
                topic: "String", 
                title: "Check whether a string is Palindrome or not", 
                explanationUrl: "https://takeuforward.org/data-structures/check-if-a-string-is-palindrome-or-not/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/palindrome-string0817/1" 
            },
            { 
                topic: "String", 
                title: "Find Duplicate characters in a string", 
                explanationUrl: "https://takeuforward.org/data-structures/find-duplicate-characters-in-a-string/", 
                gfgUrl: "https://www.geeksforgeeks.org/print-all-the-duplicates-in-the-input-string/" 
            },
            { 
                topic: "String", 
                title: "Check whether one string is a rotation of another", 
                explanationUrl: "https://takeuforward.org/data-structures/check-if-string-is-rotation-of-another/", 
                gfgUrl: "https://www.geeksforgeeks.org/a-program-to-check-if-strings-are-rotations-of-each-other/" 
            },

            // Tree
            { 
                topic: "Tree", 
                title: "Level order traversal", 
                explanationUrl: "https://takeuforward.org/data-structures/level-order-traversal-of-binary-tree/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/level-order-traversal/1" 
            },
            { 
                topic: "Tree", 
                title: "Reverse Level Order traversal", 
                explanationUrl: "https://takeuforward.org/data-structures/reverse-level-order-traversal/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/reverse-level-order-traversal/1" 
            },
            { 
                topic: "Tree", 
                title: "Height of a tree", 
                explanationUrl: "https://takeuforward.org/data-structures/maximum-depth-of-a-binary-tree/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/height-of-binary-tree/1" 
            },
            { 
                topic: "Tree", 
                title: "Diameter of a binary tree", 
                explanationUrl: "https://takeuforward.org/data-structures/calculate-the-diameter-of-a-binary-tree/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/diameter-of-binary-tree/1" 
            },

            // Graph
            { 
                topic: "Graph", 
                title: "Create a Graph and print representation", 
                explanationUrl: "https://takeuforward.org/graph/introduction-to-graphs/", 
                gfgUrl: "https://www.geeksforgeeks.org/graphs-and-its-representations/" 
            },
            { 
                topic: "Graph", 
                title: "Implement Breadth First Search (BFS)", 
                explanationUrl: "https://takeuforward.org/graph/breadth-first-search-bfs-level-order-traversal/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/bfs-traversal-of-graph/1" 
            },
            { 
                topic: "Graph", 
                title: "Implement Depth First Search (DFS)", 
                explanationUrl: "https://takeuforward.org/graph/depth-first-search-dfs/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/print-adjacency-list-1587115620/1" 
            },
            { 
                topic: "Graph", 
                title: "Detect Cycle in a Directed Graph", 
                explanationUrl: "https://takeuforward.org/graph/detect-cycle-in-a-directed-graph-dfs/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/detect-cycle-in-a-directed-graph/1" 
            },

            // Trie
            { 
                topic: "Trie", 
                title: "Construct a Trie (Insert, Search, Delete)", 
                explanationUrl: "https://takeuforward.org/data-structures/implement-trie-1/", 
                gfgUrl: "https://www.geeksforgeeks.org/trie-insert-and-search/" 
            },
            { 
                topic: "Trie", 
                title: "Print all valid words present in a dictionary", 
                explanationUrl: "https://takeuforward.org/data-structures/trie-complete-implementation/", 
                gfgUrl: "https://www.geeksforgeeks.org/boggle-find-all-possible-words-in-a-board-of-characters/" 
            },
            { 
                topic: "Trie", 
                title: "Phone directory / Auto-complete feature", 
                explanationUrl: "https://takeuforward.org/data-structures/implement-trie-ii/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/phone-directory4628/1" 
            },

            // DP
            { 
                topic: "DP", 
                title: "Coin Change Problem", 
                explanationUrl: "https://takeuforward.org/data-structures/coin-change-dp-20/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/coin-change2448/1" 
            },
            { 
                topic: "DP", 
                title: "0/1 Knapsack Problem", 
                explanationUrl: "https://takeuforward.org/data-structures/0-1-knapsack-dp-19/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/0-1-knapsack-problem0945/1" 
            },
            { 
                topic: "DP", 
                title: "Longest Common Subsequence", 
                explanationUrl: "https://takeuforward.org/data-structures/longest-common-subsequence-dp-25/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/longest-common-subsequence-1587115620/1" 
            },
            { 
                topic: "DP", 
                title: "Word Break Problem", 
                explanationUrl: "https://takeuforward.org/data-structures/word-break-problem-dp-132/", 
                gfgUrl: "https://practice.geeksforgeeks.org/problems/word-break1352/1" 
            }
        ];

        const topicSelect = document.getElementById('topic-select');
        const randomBtn = document.getElementById('random-btn');
        const questionCard = document.getElementById('question-card');
        const qTopic = document.getElementById('q-topic');
        const qTitle = document.getElementById('q-title');
        const qExplanationLink = document.getElementById('q-explanation-link');
        const qGfgLink = document.getElementById('q-gfg-link');

        randomBtn.addEventListener('click', () => {
            const selectedTopic = topicSelect.value;
            
            let filtered = dsaQuestions;
            if (selectedTopic !== 'all') {
                filtered = dsaQuestions.filter(q => q.topic === selectedTopic);
            }

            if (filtered.length === 0) {
                alert('No questions available for this topic.');
                return;
            }

            const randomIndex = Math.floor(Math.random() * filtered.length);
            const question = filtered[randomIndex];

            qTopic.textContent = question.topic;
            qTitle.textContent = question.title;
            qExplanationLink.href = question.explanationUrl;
            qGfgLink.href = question.gfgUrl;

            questionCard.classList.remove('hidden');
        });

        // Register a lightweight dynamic Service Worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
                const swBlob = new Blob([swCode], {type: 'text/javascript'});
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA Service Worker Ready'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
